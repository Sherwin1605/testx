air:
  conditions:
    - gamemode{gm=creative,spectator} false hide #If you want the HUD to be displayed even when you are in Creative or Spectator Mode, delete this line. #If you want the HUD to be displayed even when you are in Creative or Spectator Mode, delete this line.
  layers:
    icon:
      texture:
        path: assets/mmohud/icon_air.png
      offset:                           
        x: -2
        y: 0
      conditions:
      - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
    fill:
      texture:
        path: assets/mmohud/bar_fill_air.png
      color: "#51ccff"
      offset:
        x: 0
        y: -3
      function:
        listener: air
        increment: 40
        orientation: horizontal
      conditions:
      - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
    outline:
      texture:
        path: assets/mmohud/bar_outline_air.png
      offset:
        x: -1
        y: -2
      conditions:
      - placeholder{ph=%player_remaining_air%;v=%player_max_air%;o=<} true hide
