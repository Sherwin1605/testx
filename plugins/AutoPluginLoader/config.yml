    Usage:  '&bᴀᴘʟ &7• &fUsage&8: &e/apl usage (plugin)'
    Info:   '&bᴀᴘʟ &7• &fUsage&8: &e/apl info (plugin)'

# -------------------------------------------------------------------------

update-check:
  enabled: true
  permission: autopluginloader.update
  message: "&bᴀᴘʟ &7• &fA new version, &b%latest%&f, is available. You're running &e%current%&f."

settings:
  Your-Plugins-Folder: 'plugins'

  Automatically-Load-Plugins:   true
  Automatically-Update-Plugins: true # This DOES NOT mean when an update is released it will automatically be downloaded and uploaded to your server.
  # The above option refers to if you click and drag an already loaded jar (Example: WorldEdit) into the plugins folder, but it's a new version.
  # APL will detect that and reload the code. This updates its currently loaded version/code without the need of a restart.
  # Sorry for any confusion. I hope this clears this feature up.

  Load-Data-Delay: 5       # Seconds – must be < Timer-Delay
  Task:
    Timer-Delay: 10        # Seconds – must be > Load-Data-Delay
    Timer: 1               # Seconds – check interval

  Seconds-Before-Reloading: 5  # Minimum age (s) before an update triggers
  Seconds-Before-Loading:   5  # Delay (s) after uploading a new *.jar

  Always-Reload-A-Plugins-Dependencies: true   # If false, use “-d” flag when unloading
  Send-Players-Alerts: true                    # Needs AutoPluginLoader.Alerts permission

  Plugins-To-Ignore:                            # Skipped for auto-updates
    - 'WorldEdit'
    - 'WorldGuard'
    - 'AutoPluginLoader'       # Don’t remove – avoids recursion issues
    - 'Skript'                 # Skript reloads can break extensions
    - 'ItemsAdder'
    - 'Oraxen'