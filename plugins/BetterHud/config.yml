debug: false
auto-save-time: 300
location-provide-time: 1
debug-level: assets
metrics: true
version-check: true
number-format: '#,###.#'
tick-speed: 1
namespace: betterhud
default-font-name: font.ttf
bossbar-line: 1
bossbar-resource-pack-line: 0
merge-boss-bar: true
disable-to-bedrock-player: true
build-folder-location: ItemsAdder/contents/betterhud/resourcepack
pack-type: folder
enable-protection: false
enable-self-host: false
force-update: false
self-host-ip: '*'
self-host-port: 8163
merge-other-folders: []
loading-head: random
default-hud:
- fantasy_hud
- fantasy_hud_compass
- fantasy_hud_sublevel_images
- fantasy_hud_sublevel_texts
- fantasy_hud_season
- fantasy_hud_durability
- fantasy_hud_durability_bar
- fantasy_hud_durability_number
- fantasy_hud_vehicle_hp
- fantasy_hud_air
default-popup: []
default-compass: []
load-minecraft-default-textures: false
included-minecraft-list:
- block
- item
resourcepack-obfuscation: false
clear-build-folder: true
use-legacy-format: false
legacy-serializer: ampersand
minecraft-jar-version: bukkit
remove-default-hotbar: false
disable-legacy-offset: true
