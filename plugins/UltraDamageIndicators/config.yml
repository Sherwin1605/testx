# If true, only the damager will see the floating damage indicator.
only-show-to-damager: false

# Time in seconds the indicator should stay (e.g., 1 = 20 ticks).
# Never use a value under 1 or it might break.
indicatorTime: 1

# Format of the regular damage indicator.
# You can use "0.#" to insert the damage value (rounded to one decimal).
IndicatorFormat: "&4❤ &f-0.#"

# Format of the critical hit damage indicator.
CriticalIndicatorFormat: "&6&l✧ &f-0.#"
