# Additional items that should be allowed to be enchanted in the enchanting table.
# Will not add any enchantments for these items.
extra_enchantables: 
- 'COMPASS'
- 'RECOVERY_COMPASS'


# Level of Frequent Flyer increases relative durability instead of the speed.
legacy_frequent_flyer: false
advanced_options: 

    # Use the advanced customization options for the plugin
    # ** Only modify if you understand what you're doing! **
    use: false

    # Use the permission system per player for all enchantments.
    # Permissions use the system "enchantmentsolution.<enchant_name>.<type>.level<int>"
    # enchant_name: Enchantment name as used below
    # type: either table (for enchanting items) or anvil (for combining items)
    # int: the enchantment level
    # Override permission: enchantmentsolution.permissions.ignore
    use_permissions: false

    # Adds the 1.14-1.14.2 feature of additional enchantments getting lower levels
    enchantability_decay: false

    # Enchantments will not be available unless the enchanting level is the set value or above
    starting_level: true
    lapis_modifiers: 

        # Enchanting with higher amounts of lapis give higher enchantability
        use: true

        # Extra enchantability: (lapis + constant) * multiplier
        constant: -1
        multiplier: 2

    # Chance of multiple enchantments on one item. Lower value = more enchantments.
    multi_enchant_divisor: 75.0
default_enchantments: 
    aqua_affinity: 
        enabled: true
        enchantment_locations: 
        - 'TABLE'
        - 'NON_BOOK'
        - 'CHEST_LOOT'
        - 'MOB_LOOT'
