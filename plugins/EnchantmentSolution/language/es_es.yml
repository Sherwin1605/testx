    descriptions: 
        enchant: 'Encanta una ranura especificado para un jugador especificado.'
        enchantunsafe: 'Encanta una ranura especificado para un jugador especificado. Puede encantar cualquier item con cualquier nivel de encantamiento especificado.'
        removeenchant: 'Remueve una ranura especificado para un jugador especificado.'
        esanvil: 'Abre el GUI del yunque de ES para ti.'
        esgrindstone: 'Abre el GUI de la afiladora de ES para ti.'
        esdebug: 'Generata un archivo debug.yml para ayudar a la desarrolladora a resolver errores.'
        esbook: 'Da un libro con el encantamiento especificado o uno al azar a un jugador especificado. ignoreLimits en un encantamiento al azar significa no limitar a los encantamientos de los cofres.'
        info: 'Obtiene la información para un encantamiento especificado, o una lista de encantamientos.'
        esreload: 'Recarga la configuración de los archivos del servidor.'
        esreset: 'Reinicia los inventarios y los datos de la mesa de encantamientos para todos los jugadores.'
        esconfig: 'Modifica la configuración de los archivos en el juego.'
        configlore: 'Retorna una cadena de color formateado del chat para permitir compatibilidad con otros plugins.'
        escalc: 'Muestra los valores de encantabilidad para ciertos items y encantamientos o encantamientos potenciales.'
        eshelp: 'Muestra la descripción y el uso de un comando o comandos especificados.'
        esfix: 'Arregla los encantamientos en los items.'
        esrpg: 'Abre el modo ESRPG.'
        rpgstats: 'Obtiene las estadísticas ESRPG para un jugador en particular.'
        rpgtop: 'Lista los mejores jugadores en ESRPG.'
        rpgedit: 'Edita los valores ESRPG para los jugadores.'
