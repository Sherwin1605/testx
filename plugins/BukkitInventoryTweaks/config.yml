# Thanks for installing BukkitInventoryTweaks by TheJeterLP!
# Please report any bugs you may encounter at my discord under:
# https://discord.com/invite/JwaSHRk6bR
# -------------------------------Descriptions--------------------------------------
# check-for-updates: Should the plugin check for updates by itself?
# enable-bstats: Do you want to use bstats?
# debug: Should the debug log be enabled? WARNING: This will SPAM your log files, use ONLY when needed.
# locale: Which language do you want?
# ReplaceItems.replaceInCreative: Should the items be replaced in creative mode too?
# ReplaceItems.playSound: Should a sound be played to the player after the item was replaced?
# ReplaceItems.needsToMatchExactly: Does the item to replace need to match exactly? (For ex. should a woodenpickaxe be replaced by a diamond picakxe)
# ReplaceItems.onBreak: Should the item be replaced after it breaks?
# ReplaceItems.onConsume: Should the item be replaced when its consumed?
# ReplaceItems.onDrop: Should the item be replaced after it has been dropped by the player? 
# ReplaceItems.onBlockPlace: Should the item be replaced after a Block was placed?
# ItemLists.Swords: All the swords that can be replaced with each other
# ItemLists.Pickaxes: All the pickaxes that can be replaced with each other
# ItemLists.Shovels: All the shovels that can be replaced with each other
# ItemLists.Axe: All the axes that can be replaced with each other
# ItemLists.Hoe: All the hoes that can be replaced with each other
# ItemList.Food: All the food that can be replaced with each other

check-for-updates: true
enable-bstats: true
debug: false
locale: en-EN
ReplaceItems:
  replaceInCreative: false
  playSound: true
  needsToMatchExactly: false
  onBreak: true
  onConsume: true
  onDrop: false
  onBlockPlace: true
ItemLists:
  Swords:
  - WOODEN_SWORD
  - STONE_SWORD
  - GOLDEN_SWORD
  - IRON_SWORD
