# PortForwarded lets you expose local servers via serveo.net with no setup,
# no signups, no dependencies. Just plug and play.

# Format: external:internal
# - external = port on serveo.net (0 = random)
# - internal = local port (e.g., 25565 for Minecraft)
# Tip: Using 0 for external avoids conflicts with other users.

# Main forwarded port, 0 for dynamic (detected automatically for Minecraft)
mainPortForwarding: "0"

# Additional forwarding rules (optional)
additionalForwardingRules:
  - "0:25565"      # Random external → Local Server
  - "4356:25565"   # Fixed external (may fail) → Local Server